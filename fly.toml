# Fly.io config.
#
# WARNING: do not re-run `fly launch` against this file. It rewrites the config and
# injects an [http_service] block with auto_stop_machines, which stops the machine when
# no HTTP traffic arrives. This app never serves HTTP, so that setting kills the bot.
# To change settings, edit this file and run `fly deploy`.

app = 'zborle-discord-bot'
primary_region = 'fra'

[build]

[env]
  # SQLite lives on the mounted volume so stats survive deploys and restarts.
  ZBORLE_DB_PATH = '/data/zborle.db'
  ZBORLE_TIMEZONE = 'Europe/Skopje'

[[mounts]]
  source = 'zborle_data'
  destination = '/data'

# Deliberately no [http_service]. This is a Discord gateway worker, not a web app.
# Machines must stay up continuously to hold the websocket connection.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
