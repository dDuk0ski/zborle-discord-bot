# Fly.io config.
#
# WARNING: do not re-run `fly launch` against this file. It rewrites the config and
# injects an [http_service] block with auto_stop_machines, which stops the machine when
# no HTTP traffic arrives. This app never serves HTTP, so that setting kills the bot.
# To change settings, edit this file and run `fly deploy`.

app = 'zborle-discord-bot'
primary_region = 'fra'

[build]

[env]
  # SQLite lives on the mounted volume so stats survive deploys and restarts.
  ZBORLE_DB_PATH = '/data/zborle.db'
  ZBORLE_TIMEZONE = 'Europe/Skopje'

[[mounts]]
  source = 'zborle_data'
  destination = '/data'

# Serves the Discord Activity. The machine also holds the bot's gateway websocket, so
# every autoscaling knob here is deliberately disabled: auto_stop_machines would kill
# the bot the moment HTTP went quiet, and auto_start_machines is meaningless when the
# machine must never stop in the first place.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
